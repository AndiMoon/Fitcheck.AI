<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress benign Vite HMR WebSocket disconnected notices in iframe preview
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          if (args[0] && typeof args[0] === 'string' && (args[0].includes('[vite] WebSocket') || args[0].includes('WebSocket closed without opened'))) {
            return;
          }
          origError.apply(console, args);
        };
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
